<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - ARIA AI Voice Assistant</title>
    <meta name="description" content="Sign in to your ARIA AI Voice Assistant account with Google OAuth or Email & Password. Persistent SQL Database Auth.">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    
    <!-- Google Identity Services Library -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <style>
        :root {
            --bg-dark: #070913;
            --card-bg: rgba(15, 22, 41, 0.88);
            --card-border: rgba(0, 242, 254, 0.25);
            --accent-cyan: #00f2fe;
            --accent-blue: #4facfe;
            --accent-purple: #7f00ff;
            --accent-pink: #f5576c;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --danger: #ef4444;
            --font-main: 'Outfit', sans-serif;
            --font-heading: 'Space Grotesk', sans-serif;
        }

        body.light-theme {
            --bg-dark: #f8fafc;
            --card-bg: rgba(255, 255, 255, 0.94);
            --card-border: rgba(0, 51, 102, 0.15);
            --text-primary: #0f172a;
            --text-secondary: #334155;
            --text-muted: #64748b;
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(0, 242, 254, 0.18) 0%, transparent 45%),
                radial-gradient(circle at 85% 85%, rgba(127, 0, 255, 0.18) 0%, transparent 45%);
        }

        body.light-theme .auth-card {
            box-shadow: 0 15px 40px rgba(0, 51, 102, 0.15);
        }

        body.light-theme .form-input {
            background: rgba(241, 245, 249, 0.95);
            border-color: rgba(0, 51, 102, 0.2);
            color: #0f172a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: var(--font-main);
            background-color: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(127, 0, 255, 0.3) 0%, transparent 45%),
                radial-gradient(circle at 85% 85%, rgba(0, 242, 254, 0.25) 0%, transparent 45%);
            background-attachment: fixed;
            position: relative;
        }

        .auth-card {
            width: 100%;
            max-width: 460px;
            background: var(--card-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 36px 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6), 0 0 40px rgba(0, 242, 254, 0.2);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .auth-header {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .brand-logo {
            width: 56px;
            height: 56px;
            border-radius: 16px;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 25px rgba(0, 242, 254, 0.5);
        }

        .brand-logo svg {
            width: 32px;
            height: 32px;
            fill: #ffffff;
        }

        .auth-title {
            font-family: var(--font-heading);
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, #ffffff, var(--accent-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        /* Auth Mode Tabs */
        .auth-tabs {
            display: flex;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 4px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-family: var(--font-main);
            font-weight: 600;
            font-size: 0.9rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, rgba(0, 242, 254, 0.2), rgba(127, 0, 255, 0.3));
            color: #ffffff;
            border: 1px solid rgba(0, 242, 254, 0.3);
            box-shadow: 0 4px 12px rgba(0, 242, 254, 0.15);
        }

        /* OAuth Provider Buttons */
        .social-btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn-social {
            width: 100%;
            padding: 13px;
            border-radius: 12px;
            font-family: var(--font-main);
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: all 0.25s ease;
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .btn-social:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
        }

        .btn-google {
            background: rgba(255, 255, 255, 0.08);
            color: #ffffff;
            border-color: rgba(255, 255, 255, 0.2);
        }

        .btn-google:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: var(--accent-cyan);
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--text-muted);
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.1);
        }

        /* Form Inputs */
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-label {
            font-size: 0.85rem;
            color: var(--text-secondary);
            font-weight: 600;
        }

        .form-input {
            width: 100%;
            background: rgba(8, 12, 24, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            padding: 13px 16px;
            color: var(--text-primary);
            font-family: var(--font-main);
            font-size: 0.98rem;
            outline: none;
            transition: border-color 0.25s ease, box-shadow 0.25s ease;
        }

        .form-input:focus {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 18px rgba(0, 242, 254, 0.3);
        }

        .btn-primary {
            width: 100%;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
            color: #ffffff;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-family: var(--font-main);
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(0, 242, 254, 0.4);
            transition: all 0.25s ease;
        }

        .btn-primary:hover {
            transform: scale(1.02);
            box-shadow: 0 6px 25px rgba(0, 242, 254, 0.6);
        }

        .btn-guest {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-secondary);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 11px;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-guest:hover {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
        }

        .alert-box {
            padding: 12px 14px;
            border-radius: 10px;
            font-size: 0.88rem;
            text-align: center;
            display: none;
            line-height: 1.4;
        }

        .alert-box.success {
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid var(--accent-cyan);
            color: var(--accent-cyan);
        }

        .alert-box.error {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid var(--danger);
            color: #fca5a5;
        }

        .back-link {
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-muted);
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .back-link:hover { color: var(--accent-cyan); }

        #g_id_onload_container {
            display: flex;
            justify-content: center;
            margin-top: 4px;
        }
    </style>
</head>
<body>
    <button id="theme-toggle-btn" style="position: absolute; top: 20px; right: 20px; background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2); color: var(--text-primary); padding: 8px 16px; border-radius: 20px; font-family: var(--font-main); cursor: pointer; font-size: 0.85rem; font-weight: 600; z-index: 100;">☀️ Light Mode</button>

    <div class="auth-card">
        <div class="auth-header">
            <div class="brand-logo">
                <svg viewBox="0 0 24 24"><path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L4.35 19.4c-.39.39-.39 1.02 0 1.41.39.39 1.02.39 1.41 0l1.9-1.9C9.2 19.57 10.55 20 12 20c4.97 0 9-4.03 9-9s-4.03-9-9-9zm0 15c-3.31 0-6-2.69-6-6s2.69-6 6-6 6 2.69 6 6-2.69 6-6 6z"/></svg>
            </div>
            <h1 class="auth-title">Sign In to ARIA</h1>
            <p class="subtitle">Access your AI Voice Assistant & persistent SQL database</p>
        </div>

        <div class="auth-tabs">
            <button class="tab-btn active" id="tab-login">Sign In</button>
            <button class="tab-btn" id="tab-register">Create Account</button>
        </div>

        <div class="alert-box" id="alert-box"></div>

        <!-- Google OAuth Sign In Section -->
        <div class="social-btn-group">
            <button class="btn-social btn-google" id="login-google-custom">
                <svg viewBox="0 0 24 24" style="width:20px; height:20px; fill:#ea4335;"><path d="M12.545,10.239v3.821h5.445c-0.712,2.315-2.647,3.972-5.445,3.972c-3.332,0-6.033-2.701-6.033-6.032s2.701-6.032,6.033-6.032c1.498,0,2.866,0.549,3.921,1.453l2.814-2.814C17.503,2.988,15.139,2,12.545,2C7.021,2,2.543,6.477,2.543,12s4.478,10,10.002,10c8.396,0,10.249-7.85,9.426-11.761H12.545z"/></svg>
                <span>Continue with Google</span>
            </button>
            <!-- Native Google GIS SDK Container -->
            <div id="g_id_onload_container">
                <div id="g_id_onload"
                    data-client_id="YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com"
                    data-context="signin"
                    data-ux_mode="popup"
                    data-callback="handleGoogleCredentialResponse"
                    data-auto_prompt="false">
                </div>
            </div>
        </div>

        <div class="divider" id="divider-text">OR SIGN IN WITH EMAIL</div>

        <!-- Email & Password Form (SQL Persistent Auth) -->
        <form id="auth-form" style="display: flex; flex-direction: column; gap: 14px;">
            <div class="form-group" id="name-group" style="display: none;">
                <label class="form-label" for="login-name">Full Name</label>
                <input type="text" id="login-name" class="form-input" placeholder="Alex Rivers" autocomplete="name">
            </div>

            <div class="form-group">
                <label class="form-label" for="login-email">Email Address</label>
                <input type="email" id="login-email" class="form-input" placeholder="name@example.com" required autocomplete="email">
            </div>

            <div class="form-group">
                <label class="form-label" for="login-password">Password</label>
                <input type="password" id="login-password" class="form-input" placeholder="••••••••" required autocomplete="current-password">
            </div>

            <button type="submit" class="btn-primary" id="btn-submit">Sign In</button>
        </form>

        <button class="btn-guest" id="login-guest">👤 Continue as Guest User</button>

        <a href="index.html" class="back-link">← Back to Voice Control Center</a>
    </div>

    <script>
        let currentMode = 'login'; // 'login' or 'register'

        // JWT decoder helper
        function parseJwt(token) {
            try {
                const base64Url = token.split('.')[1];
                const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
                const jsonPayload = decodeURIComponent(atob(base64).split('').map(function(c) {
                    return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
                }).join(''));
                return JSON.parse(jsonPayload);
            } catch (e) {
                return null;
            }
        }

        // Global Google Identity Services Callback Handler
        window.handleGoogleCredentialResponse = function(response) {
            if (response && response.credential) {
                const payload = parseJwt(response.credential);
                if (payload) {
                    sendGoogleAuthToDB({
                        google_id: payload.sub,
                        email: payload.email,
                        name: payload.name,
                        picture: payload.picture
                    });
                    return;
                }
            }
            showAlert('Google Sign-In response received', 'success');
        };

        function showAlert(msg, type = 'success') {
            const alertBox = document.getElementById('alert-box');
            alertBox.className = `alert-box ${type}`;
            alertBox.textContent = msg;
            alertBox.style.display = 'block';
        }

        function completeLogin(user) {
            localStorage.setItem('aria_logged_user', JSON.stringify(user));
            showAlert(`✓ Welcome, ${user.name}! Account connected as ${user.id}. Redirecting...`, 'success');
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 1000);
        }

        async function sendGoogleAuthToDB(googleUser) {
            showAlert('Connecting Google Account...', 'success');
            const apiEndpoints = ['/api/auth/google', 'http://localhost:5000/api/auth/google'];
            for (const ep of apiEndpoints) {
                try {
                    const res = await fetch(ep, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(googleUser)
                    });
                    if (res.ok) {
                        const data = await res.json();
                        if (data.status === 'success') {
                            completeLogin(data.user);
                            return;
                        }
                    }
                } catch (err) {}
            }
            
            // Fallback for static published site
            let count = parseInt(localStorage.getItem('aria_google_user_count') || '0') + 1;
            localStorage.setItem('aria_google_user_count', count);
            completeLogin({
                id: `google_user_${count}`,
                name: googleUser.name || 'Google User',
                email: googleUser.email || 'user@gmail.com',
                provider: 'Google',
                picture: googleUser.picture || ''
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            // Theme Switcher Sync
            const themeToggleBtn = document.getElementById('theme-toggle-btn');
            function applyAuthTheme(t) {
                if (t === 'light') {
                    document.body.classList.add('light-theme');
                    if (themeToggleBtn) themeToggleBtn.textContent = '🌙 Dark Mode';
                } else {
                    document.body.classList.remove('light-theme');
                    if (themeToggleBtn) themeToggleBtn.textContent = '☀️ Light Mode';
                }
                localStorage.setItem('aria_theme_mode', t);
            }
            applyAuthTheme(localStorage.getItem('aria_theme_mode') || 'dark');
            if (themeToggleBtn) {
                themeToggleBtn.addEventListener('click', () => {
                    const isLight = document.body.classList.contains('light-theme');
                    applyAuthTheme(isLight ? 'dark' : 'light');
                });
            }

            const tabLogin = document.getElementById('tab-login');
            const tabRegister = document.getElementById('tab-register');
            const nameGroup = document.getElementById('name-group');
            const btnSubmit = document.getElementById('btn-submit');
            const authForm = document.getElementById('auth-form');
            const loginName = document.getElementById('login-name');
            const loginEmail = document.getElementById('login-email');
            const loginPassword = document.getElementById('login-password');
            const dividerText = document.getElementById('divider-text');

            // Switch to Sign In mode
            tabLogin.addEventListener('click', () => {
                currentMode = 'login';
                tabLogin.classList.add('active');
                tabRegister.classList.remove('active');
                nameGroup.style.display = 'none';
                loginName.required = false;
                btnSubmit.textContent = 'Sign In';
                dividerText.textContent = 'OR SIGN IN WITH EMAIL';
                document.getElementById('alert-box').style.display = 'none';
            });

            // Switch to Register mode
            tabRegister.addEventListener('click', () => {
                currentMode = 'register';
                tabRegister.classList.add('active');
                tabLogin.classList.remove('active');
                nameGroup.style.display = 'flex';
                loginName.required = true;
                btnSubmit.textContent = 'Create Account';
                dividerText.textContent = 'OR CREATE ACCOUNT WITH EMAIL';
                document.getElementById('alert-box').style.display = 'none';
            });

            // Google Custom Button Click Handler
            document.getElementById('login-google-custom').addEventListener('click', () => {
                window.location.href = 'google_login.html';
            });

            // Guest Login Button Click Handler
            document.getElementById('login-guest').addEventListener('click', () => {
                completeLogin({
                    id: 'guest_user_1',
                    name: 'Guest User',
                    email: 'guest@aria.ai',
                    provider: 'Guest'
                });
            });

            // Email & Password Form Submission Handler (Flask API + Published Site Fallback)
            authForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const email = loginEmail.value.trim();
                const password = loginPassword.value.trim();
                const name = loginName.value.trim();

                if (!email || !password) {
                    showAlert('Please provide both email and password.', 'error');
                    return;
                }

                btnSubmit.disabled = true;
                btnSubmit.style.opacity = '0.7';

                const relativeEndpoint = currentMode === 'register' ? '/api/auth/register' : '/api/auth/email-login';
                const payload = currentMode === 'register' ? { email, password, name } : { email, password };
                const apiEndpoints = [relativeEndpoint, `http://localhost:5000${relativeEndpoint}`];

                let authenticatedUser = null;

                for (const ep of apiEndpoints) {
                    try {
                        const response = await fetch(ep, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(payload)
                        });

                        if (response.ok) {
                            const data = await response.json();
                            if (data.status === 'success') {
                                authenticatedUser = data.user;
                                break;
                            }
                        }
                    } catch (err) {}
                }

                if (authenticatedUser) {
                    completeLogin(authenticatedUser);
                } else {
                    // Fallback for Static Published Site (assigns derived email_user_1, email_user_2, etc.)
                    let count = parseInt(localStorage.getItem('aria_email_user_count') || '0') + 1;
                    localStorage.setItem('aria_email_user_count', count);
                    const nameStr = name || email.split('@')[0];
                    const formattedName = nameStr.charAt(0).toUpperCase() + nameStr.slice(1);
                    const fallbackUser = {
                        id: `email_user_${count}`,
                        name: formattedName,
                        email: email,
                        provider: 'Email'
                    };
                    completeLogin(fallbackUser);
                }

                btnSubmit.disabled = false;
                btnSubmit.style.opacity = '1';
            });
        });
    </script>
</body>
</html>
